# CORS proxy for the bits-services VictoriaMetrics.
#
# VictoriaMetrics serves the query API but sends no CORS headers, so the
# bits-console dashboard (a different origin — GitLab Pages) cannot query it
# from the browser. This nginx adds the headers and proxies to the VM by its
# compose service name on monitoring-net. Read-only query traffic.
server {
    listen 80;

    # Only the two query endpoints the console's charts use: VictoriaMetrics also
    # deletes series and makes snapshots on a GET, so nothing else is passed on.
    location ~ ^/api/v1/(query|query_range)$ {
        limit_except GET OPTIONS {
            deny all;
        }

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        rewrite ^/api/v1/(query|query_range)$ /api/v1/$1 break;   # pass the matched path, not the raw one
        proxy_pass http://victoriametrics:8428;
        proxy_set_header Host $host;
        proxy_hide_header Access-Control-Allow-Origin;            # VictoriaMetrics sends its own
    }

    location / {
        return 404;
    }
}
