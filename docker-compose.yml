# SPDX-License-Identifier: Apache-2.0
# bits-services — persistent supporting services.
#
# Services are added per implementation-plan phase:
#   Phase 1: security-proxy        (the signer; internal network only)
#   Phase 3: bits-console backend  (relying party; only client of the proxy)
#   Phase 4: monitoring            (extracted from cvmfs-testbed)
#
# Networks are declared now so each service attaches to the right isolated
# segment when it lands. The signer sits on an internal-only network reachable
# solely by the backend; nothing else may talk to it.

services:
  # ─── Phase 1: the manifest signer ──────────────────────────────────────────
  # Reachable ONLY on signer-net, by the bits-console backend (Phase 3). No
  # published ports. No key baked or mounted — the Ed25519 seed is pushed over
  # the ingest socket at runtime and held only in memory.
  security-proxy:
    build:
      # Context is the submodule itself, not the repo root: BuildKit omits a git
      # submodule's files when the context root is the parent repo (the gitlink
      # reads as empty). The Dockerfile lives outside that context, which compose
      # + BuildKit allow.
      context: ali-bot/security-proxy
      dockerfile: ../../security-proxy/Dockerfile
    image: bits-services/security-proxy:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Keep the in-memory key off disk: no core dump can write it out, and don't
    # swap the proxy's anon pages (belt-and-suspenders with swapoff -a on the VM).
    ulimits:
      core: 0
    mem_swappiness: 0
    volumes:
      # Root-owned config (from security-proxy/config.sample.json), read-only.
      - ${SECURITY_PROXY_CONFIG_DIR:?set SECURITY_PROXY_CONFIG_DIR in .env}:/etc/security-proxy:ro
      # Agent + ingest sockets on a named volume (inherits the image's
      # securityproxy ownership); the backend shares this volume in Phase 3.
      - signer-sockets:/run/security-proxy
    networks:
      - signer-net
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/security-proxy/agent.sock"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ─── Phase 3 (Stage B): the relying-party backend ──────────────────────────
  # Faces the browser (behind web.cern.ch on services-net) and is the ONLY client
  # of the security-proxy (signer-net). Holds no key. Built from the vendored
  # `bits` submodule (console-backend/ + bits_helpers/).
  bits-console-backend:
    build:
      # Context is the bits submodule (BuildKit gitlink reason); Dockerfile is
      # outside it, same as the security-proxy service.
      context: bits
      dockerfile: ../bits-console-backend/Dockerfile
    image: bits-services/bits-console-backend:local
    restart: unless-stopped
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Wired in B3; empty is fine for the skeleton.
      BITS_SIGN_PROXY_URL: "${BITS_SIGN_PROXY_URL:-}"
      GITLAB_API_URL: "${GITLAB_API_URL:-}"
    networks:
      - signer-net
      - services-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    # No host port by default — web.cern.ch reverse-proxies to it on services-net.
    # Add a ports: mapping only to front it directly during local dev.

networks:
  # Internal-only: the signer. No external connectivity in or out; only the
  # bits-console backend is also attached here (Phase 3).
  signer-net:
    driver: bridge
    internal: true
  # Backend <-> public front (web.cern.ch reverse-proxy) and monitoring scrape.
  services-net:
    driver: bridge

volumes:
  # Agent + ingest UNIX sockets for the signer; shared with the backend (Phase 3).
  signer-sockets:
