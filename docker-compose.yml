# SPDX-License-Identifier: Apache-2.0
# bits-services — persistent supporting services.
#
# Services are added per implementation-plan phase:
#   Phase 1: security-proxy        (the signer; internal network only)
#   Phase 3: bits-console backend  (relying party; only client of the proxy)
#   Phase 4: monitoring            (moved from cvmfs-testbed; shared by every
#                                   setup on this host, data persists here)
#
# Networks are declared now so each service attaches to the right isolated
# segment when it lands. The signer sits on an internal-only network reachable
# solely by the backend and the orchestrator worker; nothing else may talk to it.

services:
  # ─── Phase 1: the manifest signer ──────────────────────────────────────────
  # Reachable ONLY on signer-net, by the bits-console backend (Phase 3) and,
  # since M8a, the orchestrator worker. No
  # published ports. No key baked or mounted — the Ed25519 seed is pushed over
  # the ingest socket at runtime and held only in memory.
  security-proxy:
    build:
      # Context is the submodule itself, not the repo root: BuildKit omits a git
      # submodule's files when the context root is the parent repo (the gitlink
      # reads as empty). The Dockerfile lives outside that context, which compose
      # + BuildKit allow.
      context: ali-bot/security-proxy
      dockerfile: ../../security-proxy/Dockerfile
    image: bits-services/security-proxy:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      # Ingest (key push) socket: private to this container, reached only via
      # `docker compose exec` (make unlock) — never shared with the backend.
      - /run/security-proxy-ingest:uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Keep the in-memory key off disk: no core dump can write it out, and don't
    # swap the proxy's anon pages (belt-and-suspenders with swapoff -a on the VM).
    ulimits:
      core: 0
    mem_swappiness: 0
    volumes:
      # Root-owned config (from security-proxy/config.sample.json), read-only.
      - ${SECURITY_PROXY_CONFIG_DIR:?set SECURITY_PROXY_CONFIG_DIR in .env}:/etc/security-proxy:ro
      # Agent socket on a named volume (group bitssign); the backend mounts it
      # read-only to read the proxy's current port + gate token.
      - signer-sockets:/run/security-proxy
    # Make sure the proxy runs with its socket group (gid 10002 = bitssign), however
    # the image's USER is spelled; it chowns the agent socket dir to that group.
    group_add:
      - "10002"
    networks:
      - signer-net
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/security-proxy/agent.sock"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ─── The credentials proxy (orchestrator M6) ───────────────────────────────
  # A second security-proxy instance, from the same image: it holds the GitLab
  # tokens and the store's keys, which `make unlock` pushes into its memory, and
  # adds them to the backend's and the worker's requests on the way out. They
  # hold only its gate tokens, from its agent socket. Kept apart from the
  # signer: it needs egress, and the signer keeps none (signer-net is internal).
  # Config: security-proxy/credentials.sample.json; secrets: tools/service-secrets.py.
  credentials-proxy:
    image: bits-services/security-proxy:local
    pull_policy: never          # built by security-proxy above
    # Off until it is set up (config dir, secrets): COMPOSE_PROFILES=credentials
    # in .env starts it with the rest. No depends_on the signer, so starting this
    # one never recreates the signer (which would drop its key).
    profiles:
      - credentials
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run/security-proxy-ingest:uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
    mem_swappiness: 0
    volumes:
      - ${CREDENTIALS_PROXY_CONFIG_DIR:-./config/credentials-proxy}:/etc/security-proxy:ro
      - credential-sockets:/run/security-proxy
    group_add:
      - "10002"
    networks:
      - cred-net
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/security-proxy/agent.sock"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ─── The store writer (orchestrator M8a) ───────────────────────────────────
  # A third security-proxy instance, from the same image: its only route, s3,
  # holds the store keypair the worker writes its manifests with. Only the
  # worker mounts its socket and shares its network: the backend, which faces the
  # internet, cannot reach it. Config: security-proxy/store-writer.sample.json;
  # its slots (s3-access-<bucket>, s3-secret-<bucket>) are pushed by make unlock.
  store-writer:
    image: bits-services/security-proxy:local
    pull_policy: never          # built by security-proxy above
    profiles:
      - store
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run/security-proxy-ingest:uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
    mem_swappiness: 0
    volumes:
      - ${STORE_WRITER_CONFIG_DIR:-./config/store-writer}:/etc/security-proxy:ro
      - store-writer-sockets:/run/security-proxy
    group_add:
      - "10002"
    networks:
      - store-net
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/security-proxy/agent.sock"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ─── Phase 3 (Stage B): the relying-party backend ──────────────────────────
  # Its OWN origin (e.g. https://bits.cern.ch): the browser on the GitLab Pages
  # frontend (bits-console.web.cern.ch) calls it cross-origin. It is the ONLY
  # client of the security-proxy (signer-net) and holds no key. Built from the
  # local `bits` checkout (console-backend/ + bits_helpers/).
  bits-console-backend:
    build:
      # Built from your LOCAL bits checkout (BITS_SRC, default ../bits) — a
      # submodule can't be used here (the console-backend code is local/unpushed).
      context: ${BITS_SRC:-../bits}
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY . /src
        ENV PYTHONPATH=/src:/src/console-backend PYTHONDONTWRITEBYTECODE=1
        RUN pip install --no-cache-dir /src/console-backend cryptography pyyaml requests boto3
        # /data (persistent passkey store) must be writable by the runtime user; a
        # fresh named volume mounted here inherits this ownership.
        RUN install -d -o nobody -g nogroup /data /orch
        USER nobody
        EXPOSE 8443
        CMD ["uvicorn","console_backend.main:app","--host","0.0.0.0","--port","8443","--ssl-keyfile","/certs/key.pem","--ssl-certfile","/certs/cert.pem"]
    image: bits-services/bits-console-backend:local
    restart: unless-stopped
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Signing proxy — wired by `make unlock` once the proxy is up (URL + gate
      # token only exist then, and change on a proxy restart).
      # The proxy picks a random port per start and rotates its gate token daily,
      # so the backend asks its agent socket for both. Set it to empty in .env to
      # use a static URL/TOKEN instead (dev only; they go stale).
      BITS_SIGN_PROXY_AGENT_SOCKET: "${BITS_SIGN_PROXY_AGENT_SOCKET-/run/security-proxy/agent.sock}"
      BITS_SIGN_PROXY_URL: "${BITS_SIGN_PROXY_URL:-}"
      BITS_SIGN_PROXY_TOKEN: "${BITS_SIGN_PROXY_TOKEN:-}"
      # M8b, the switch (with the worker's): the /sign routes answer 410.
      BITS_ORCH_OWNS_SET: "${BITS_ORCH_OWNS_SET:-}"
      # The build queue (with the worker's): POST /ops/queue.
      BITS_ORCH_QUEUE: "${BITS_ORCH_QUEUE:-}"
      # Identity (verifies the browser's GitLab token via GET /user) + CORS.
      GITLAB_API_URL: "${GITLAB_API_URL:-}"
      BITS_FRONTEND_ORIGIN: "${BITS_FRONTEND_ORIGIN:-}"
      BITS_ADMINS_POLICY: "${BITS_ADMINS_POLICY:-}"
      BITS_ADMIN_RESOLVE_TOKEN: "${BITS_ADMIN_RESOLVE_TOKEN:-}"
      # Convention: derive the whole admin policy from this GitLab group tree
      # (root members = overall admins; each subgroup path = a community). Needs
      # BITS_ADMIN_RESOLVE_TOKEN to read membership. BITS_ADMINS_POLICY merges on top.
      BITS_ADMINS_GROUP: "${BITS_ADMINS_GROUP:-}"
      # Ops proxy (Phase 1): api-scope project token + the build project id, so the
      # backend can trigger builds on the caller's behalf after authz. Env for now.
      BITS_FORGE_OPS_TOKEN: "${BITS_FORGE_OPS_TOKEN:-}"
      BITS_FORGE_PROJECT: "${BITS_FORGE_PROJECT:-}"
      BITS_FORGE_REFS: "${BITS_FORGE_REFS:-main}"
      BITS_CATALOG_OWNERS: "${BITS_CATALOG_OWNERS:-}"
      BITS_CATALOG_TTL: "${BITS_CATALOG_TTL:-300}"
      BITS_GITHUB_TOKEN: "${BITS_GITHUB_TOKEN:-}"
      # WebAuthn. rp_id is a shared parent (e.g. cern.ch) so one passkey works for
      # enrolment on the Pages frontend AND approval on this backend's own page;
      # both origins are accepted at verification (BITS_WEBAUTHN_ORIGINS must list
      # the backend origin, since the approve page runs there).
      BITS_WEBAUTHN_RP_ID: "${BITS_WEBAUTHN_RP_ID:-}"
      BITS_WEBAUTHN_ORIGIN: "${BITS_WEBAUTHN_ORIGIN:-}"
      BITS_WEBAUTHN_ORIGINS: "${BITS_WEBAUTHN_ORIGINS:-}"
      BITS_WEBAUTHN_CREDENTIALS: "${BITS_WEBAUTHN_CREDENTIALS:-/data/creds.json}"
      BITS_WEBAUTHN_REQUIRE_UV: "${BITS_WEBAUTHN_REQUIRE_UV:-1}"
      BITS_ENROLLMENT_AUTHORITY: "${BITS_ENROLLMENT_AUTHORITY:-1}"
      BITS_WEBAUTHN_REQUIRED: "${BITS_WEBAUTHN_REQUIRED:-0}"
      # Orchestrator database, shared with bits-orchestrator (which owns and
      # migrates it); the API writes only action requests and approvals.
      BITS_ORCH_DB: /orch/orch.db
      # The store, read only, for the builds' SBOMs (GET /ops/builds/{pipeline}/sbom):
      # anonymously or through the credentials proxy; no store keys here.
      BITS_ORCH_STORE: "${BITS_ORCH_STORE:-}"
      BITS_ORCH_STORE_ANONYMOUS: "${BITS_ORCH_STORE_ANONYMOUS:-}"
      BITS_ORCH_S3_ENDPOINT: "${BITS_ORCH_S3_ENDPOINT:-}"
      BITS_S3_ENDPOINT_URL: "${BITS_S3_ENDPOINT_URL:-}"
      BITS_ORCH_S3_REGION: "${BITS_ORCH_S3_REGION:-us-east-1}"
      # Audience of the CI ID tokens build jobs send with their hints (/ops/ci/*),
      # distinct from BITS_OIDC_CI_AUDIENCE so a hint token cannot sign.
      BITS_ORCH_CI_AUDIENCE: "${BITS_ORCH_CI_AUDIENCE:-bits-orchestrator}"
      # CI identity (optional; for automated signing later).
      BITS_OIDC_ISSUER: "${BITS_OIDC_ISSUER:-}"
      BITS_OIDC_CI_AUDIENCE: "${BITS_OIDC_CI_AUDIENCE:-}"
      BITS_OIDC_JWKS_URL: "${BITS_OIDC_JWKS_URL:-}"
      BITS_CI_SIGNERS: "${BITS_CI_SIGNERS:-}"
      # Phase 2: backend-as-OIDC-client login + its own session (browser holds no
      # GitLab token). Confidential client (secret); reuses OIDC_ISSUER/JWKS_URL above.
      BITS_OIDC_LOGIN_CLIENT_ID: "${BITS_OIDC_LOGIN_CLIENT_ID:-}"
      BITS_OIDC_LOGIN_CLIENT_SECRET: "${BITS_OIDC_LOGIN_CLIENT_SECRET:-}"
      BITS_OIDC_LOGIN_REDIRECT: "${BITS_OIDC_LOGIN_REDIRECT:-}"
      BITS_OIDC_AUTHORIZE_URL: "${BITS_OIDC_AUTHORIZE_URL:-}"
      BITS_OIDC_TOKEN_URL: "${BITS_OIDC_TOKEN_URL:-}"
      BITS_SESSION_TTL: "${BITS_SESSION_TTL:-86400}"
      BITS_LOGIN_MAX_AGE: "${BITS_LOGIN_MAX_AGE:-}"
      BITS_LOGIN_RETURN_ALLOW: "${BITS_LOGIN_RETURN_ALLOW:-}"
      # M6: set to /run/credentials-proxy/agent.sock (in .env) once the service
      # secrets are pushed and checked; then BITS_FORGE_OPS_TOKEN and
      # BITS_ADMIN_RESOLVE_TOKEN can go. Empty = the tokens above, as before.
      BITS_CRED_PROXY_AGENT_SOCKET: "${BITS_CRED_PROXY_AGENT_SOCKET:-}"
      # The help chat: Ollama on this host (http://host.docker.internal:11434).
      # Empty = no chat. Set with the worker's, which keeps its docs index.
      BITS_CHAT_URL: "${BITS_CHAT_URL:-}"
      BITS_CHAT_MODEL: "${BITS_CHAT_MODEL:-gemma4:12b}"
      BITS_CHAT_CONTEXT: "${BITS_CHAT_CONTEXT:-16384}"
      BITS_CHAT_THINK: "${BITS_CHAT_THINK:-}"
    # The host's Ollama, listening on the docker bridge (DEPLOYMENT.md, "The help chat").
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "443:8443"          # https on the backend's own origin
    volumes:
      - webauthn-creds:/data                                   # persistent passkeys
      - orch-data:/orch                                        # orchestrator database
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR in .env}:/certs:ro    # cert.pem + key.pem
      # The signer's agent socket, until the switch (M8b): then
      # BACKEND_SIGNER_SOCKETS=retired-signer-sockets gives the backend an empty
      # volume instead, so only the worker can reach the signer.
      - ${BACKEND_SIGNER_SOCKETS:-signer-sockets}:/run/security-proxy:ro
      - credential-sockets:/run/credentials-proxy:ro           # credentials proxy's
    # gid 10002 = 'bitssign' in the security-proxy image: lets the (nobody) backend
    # connect to the agent socket, nothing else of the proxy's.
    group_add:
      - "10002"
    networks:
      - signer-net
      - services-net
      - cred-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:8443/healthz', context=ssl._create_unverified_context())"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  # ─── Orchestrator worker ───────────────────────────────────────────────────
  # The backend's image, run as its own process: owns the orchestrator database
  # (/orch, shared with the backend) and runs actions with the forge token. No
  # published port; on signer-net since it certifies builds (M8a).
  bits-orchestrator:
    image: bits-services/bits-console-backend:local
    pull_policy: never          # built by bits-console-backend above
    depends_on:
      - bits-console-backend
      - audit-log
    command: ["python3", "-m", "console_backend.orch.worker"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      BITS_ORCH_DB: /orch/orch.db
      BITS_ORCH_INTERVAL: "${BITS_ORCH_INTERVAL:-30}"
      # Reconcile (M1): GitLab is read with a read_api token when set (else the
      # ops token); the builds' BOMs and build index come from the store.
      BITS_FORGE_READ_TOKEN: "${BITS_FORGE_READ_TOKEN:-}"
      BITS_ORCH_LOOKBACK_DAYS: "${BITS_ORCH_LOOKBACK_DAYS:-7}"
      # Failure backfill (M2): days of older failed pipelines to read once from
      # GitLab, a page per pass (0 = off).
      BITS_ORCH_BACKFILL_DAYS: "${BITS_ORCH_BACKFILL_DAYS:-0}"
      # The console's CVMFS status document (cvmfs-status.json in the build
      # project's package registry), written with the ops token (Developer).
      BITS_ORCH_CVMFS_STATUS: "${BITS_ORCH_CVMFS_STATUS:-}"
      # The build queue: queued builds start one per host of the build project's
      # build-hosts.yaml, with the ops token.
      BITS_ORCH_QUEUE: "${BITS_ORCH_QUEUE:-}"
      BITS_ORCH_BUILD_HOSTS: "${BITS_ORCH_BUILD_HOSTS:-config/build-hosts.yaml}"
      # The prepub nodes (comma-separated URLs): which build published each CVMFS
      # path, from their measurement records, for `bits trace`.
      BITS_ORCH_PREPUB_URLS: "${BITS_ORCH_PREPUB_URLS:-}"
      # A daily copy of the database (approvals, failures and the audit chain
      # cannot be rebuilt), a week kept. Put ORCH_BACKUP_DIR on another disk.
      BITS_ORCH_BACKUP_DIR: /orch-backup
      BITS_ORCH_STORE: "${BITS_ORCH_STORE:-}"
      # A publicly readable store is read with no credentials at all (set 1):
      # the credentials proxy then needs no s3 route until the worker writes (M8).
      BITS_ORCH_STORE_ANONYMOUS: "${BITS_ORCH_STORE_ANONYMOUS:-}"
      BITS_ORCH_S3_ENDPOINT: "${BITS_ORCH_S3_ENDPOINT:-}"   # empty: BITS_S3_ENDPOINT_URL, else https://s3.cern.ch
      # Certification in shadow (M4): the bits-manifests project whose main
      # pipelines certify; the worker recomputes each certification and compares
      # (read with the read token, the store above). Empty = off.
      BITS_ORCH_MANIFESTS_PROJECT: "${BITS_ORCH_MANIFESTS_PROJECT:-}"
      BITS_ORCH_DEFAULT_ARCH: "${BITS_ORCH_DEFAULT_ARCH:-}"
      # The outside copy of the audit chain (M4): the audit-log service below,
      # for now on this host; later on cvmfs-bits-01 (set the URL and token).
      # Set BITS_ORCH_AUDIT_URL= (empty) to stop sending.
      BITS_ORCH_AUDIT_URL: "${BITS_ORCH_AUDIT_URL-http://audit-log:8443}"
      BITS_ORCH_AUDIT_TOKEN: "${BITS_ORCH_AUDIT_TOKEN:-/run/secrets/audit_token}"
      BITS_ORCH_AUDIT_CAFILE: "${ORCH_AUDIT_CAFILE:+/certs/audit-ca.pem}"
      BITS_S3_ENDPOINT_URL: "${BITS_S3_ENDPOINT_URL:-}"
      AWS_ACCESS_KEY_ID: "${BITS_ORCH_S3_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${BITS_ORCH_S3_SECRET_ACCESS_KEY:-}"
      GITLAB_API_URL: "${GITLAB_API_URL:-}"
      BITS_ADMINS_POLICY: "${BITS_ADMINS_POLICY:-}"
      BITS_ADMIN_RESOLVE_TOKEN: "${BITS_ADMIN_RESOLVE_TOKEN:-}"
      BITS_ADMINS_GROUP: "${BITS_ADMINS_GROUP:-}"
      BITS_FORGE_OPS_TOKEN: "${BITS_FORGE_OPS_TOKEN:-}"
      BITS_FORGE_PROJECT: "${BITS_FORGE_PROJECT:-}"
      BITS_FORGE_REFS: "${BITS_FORGE_REFS:-main}"
      # M6: as for the backend; then BITS_FORGE_READ_TOKEN, BITS_FORGE_OPS_TOKEN,
      # BITS_ADMIN_RESOLVE_TOKEN and BITS_ORCH_S3_* can go.
      BITS_CRED_PROXY_AGENT_SOCKET: "${BITS_CRED_PROXY_AGENT_SOCKET:-}"
      BITS_ORCH_S3_REGION: "${BITS_ORCH_S3_REGION:-us-east-1}"
      # The worker certifies builds (M8a): it signs through the signer (its
      # agent socket, below) and writes through the store writer; until M8b
      # under CANARY/, which production does not read. Off until
      # BITS_ORCH_CERTIFY=1.
      BITS_ORCH_CERTIFY: "${BITS_ORCH_CERTIFY:-}"
      BITS_ORCH_CERTIFY_VALID_DAYS: "${BITS_ORCH_CERTIFY_VALID_DAYS:-30}"
      BITS_ORCH_CERTIFY_DAILY_SIGNS: "${BITS_ORCH_CERTIFY_DAILY_SIGNS:-100}"
      BITS_SIGN_PROXY_AGENT_SOCKET: "${BITS_ORCH_SIGN_PROXY_AGENT_SOCKET:-}"
      BITS_STORE_WRITER_AGENT_SOCKET: "${BITS_STORE_WRITER_AGENT_SOCKET:-}"
      # M8b, the switch: the worker owns the certified set, writes MANIFESTS/
      # and mirrors the set to bits-manifests (the gitlab-mirror route of the
      # credentials proxy, or this token). Unset = M8a.
      BITS_ORCH_OWNS_SET: "${BITS_ORCH_OWNS_SET:-}"
      BITS_FORGE_MIRROR_TOKEN: "${BITS_FORGE_MIRROR_TOKEN:-}"
      # Vulnerability scans of the builds' SBOMs: the sbom-scanner below
      # (COMPOSE_PROFILES=scanner, then http://sbom-scanner:8080). Empty = off.
      BITS_ORCH_SCANNER_URL: "${BITS_ORCH_SCANNER_URL:-}"
      # The help chat (the backend's): set, the worker reads the docs it answers
      # from, hourly from GitHub, into its index. It never calls the model.
      BITS_CHAT_URL: "${BITS_CHAT_URL:-}"
      BITS_CHAT_DOCS: "${BITS_CHAT_DOCS:-}"
    volumes:
      - orch-data:/orch
      - credential-sockets:/run/credentials-proxy:ro
      - signer-sockets:/run/security-proxy:ro            # the signer's agent socket (M8a)
      - store-writer-sockets:/run/store-writer:ro        # the store writer's (M8a)
      # Must be writable by uid 65534 (nobody), the worker's user.
      - ${ORCH_BACKUP_DIR:-./data/orch-backup}:/orch-backup
      # The CA of the audit-log service's certificate, once it runs elsewhere
      # with one that is not public.
      - ${ORCH_AUDIT_CAFILE:-/dev/null}:/certs/audit-ca.pem:ro
    secrets:
      - audit_token
    # gid 10002 = 'bitssign' in the security-proxy image: the proxies' agent
    # sockets, nothing else.
    group_add:
      - "10002"
    networks:
      - services-net
      - audit-net
      - cred-net
      - signer-net        # the signer (M8a); internal, no way out
      - store-net         # the store writer (M8a), only the worker's
      - scan-net          # the sbom-scanner, only the worker's
    healthcheck:
      # The worker touches the heartbeat after every pass (default every 30 s).
      test: ["CMD", "python3", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/orch/orch.db.heartbeat') > 150)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

  # The outside copy of the orchestrator's audit chain (audit-log/): it keeps
  # only events that link onto its chain and cannot change or remove one. For
  # now on this host, in a container and directory of its own that the worker
  # can only append to through its API; it moves to cvmfs-bits-01 later (copy
  # events.jsonl there). `make audit-token` creates the shared token.
  audit-log:
    build: ./audit-log
    image: bits-services/audit-log:local
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      AUDIT_DATA: /data
      AUDIT_LISTEN: "0.0.0.0:8443"
      AUDIT_TOKEN_FILE: /run/secrets/audit_token
    secrets:
      - audit_token
    volumes:
      # Must be writable by uid 65534 (nobody). Ideally on another disk; back it up.
      - ${AUDIT_DATA_DIR:-./data/audit-log}:/data
    networks:
      - audit-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8443/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Vulnerability scans (sbom-scanner/): grype against the builds' SBOMs, for
  # the worker alone. No secret; its only way out is grype's database download.
  sbom-scanner:
    build: ./sbom-scanner
    image: bits-services/sbom-scanner:local
    profiles:
      - scanner
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SCANNER_DB_REFRESH_HOURS: "${SCANNER_DB_REFRESH_HOURS:-6}"
    volumes:
      - scanner-db:/db
    networks:
      - scan-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10m       # the first database download

  # ─── Phase 4: monitoring (moved from cvmfs-testbed) ────────────────────────
  # One stack for every setup on this host: bits-console (push-agent reads
  # :8428, the browser's metrics_url is :8430), the cvmfs-testbed and the
  # production publishers. Same images, ports and data layout as the testbed
  # had, so nothing that talks to it changes. Data lives under
  # MONITORING_DATA_DIR and survives `make down` / `make clean`.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.99.0
    restart: unless-stopped
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=${VM_RETENTION:-13}"     # months
      - "-selfScrapeInterval=10s"
    volumes:
      - ${MONITORING_DATA_DIR:-./data/monitoring}/vm:/victoria-metrics-data
    ports:
      - "8428:8428"        # queries + /api/v1/import (push-agent, CI METRICS_URL)
    networks:
      - monitoring-net

  vmagent:
    image: victoriametrics/vmagent:v1.99.0
    restart: unless-stopped
    command:
      - "-promscrape.config=/etc/vmagent/scrape.yml"
      - "-remoteWrite.url=http://victoriametrics:8428/api/v1/write"
      - "-remoteWrite.tmpDataPath=/vmagentdata"   # buffer survives a VM restart
      - "-promscrape.maxScrapeSize=64MiB"
    volumes:
      - ./monitoring/scrape.yml:/etc/vmagent/scrape.yml:ro
      - ${MONITORING_DATA_DIR:-./data/monitoring}/vmagent:/vmagentdata
    # Other stacks on this host (the cvmfs-testbed) are scraped through their
    # published ports, not their networks, so they come and go independently.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - victoriametrics
    networks:
      - monitoring-net
      - audit-net               # scrapes audit-log's /metrics

  # Per-container CPU / memory / network / disk.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg
    command:
      - "--housekeeping_interval=10s"
      - "--max_housekeeping_interval=15s"
      - "--disable_metrics=hugetlb,referenced_memory,cpu_topology,resctrl,udp,advtcp,sched"
    networks:
      - monitoring-net

  # Host CPU / memory / temperature / filesystem.
  node-exporter:
    image: prom/node-exporter:v1.8.0
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - monitoring-net

  # Read-only CORS proxy so the console in the browser can query VM.
  vm-cors:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./monitoring/nginx-cors.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8430:80"
    depends_on:
      - victoriametrics
    networks:
      - monitoring-net

  # Prometheus http_sd for the GitLab runner fleet's node-exporters. Serves []
  # (harmless) until RUNNER_SD_TOKEN is set.
  runner-sd:
    image: python:3.12-alpine
    restart: unless-stopped
    volumes:
      - ./monitoring/runner-sd.py:/app/runner-sd.py:ro
    command: ["python", "/app/runner-sd.py"]
    environment:
      GITLAB_URL:         ${GITLAB_URL:-https://gitlab.cern.ch}
      RUNNER_SD_TOKEN:    ${RUNNER_SD_TOKEN:-}
      PROJECT_ID:         ${RUNNER_SD_PROJECT_ID:-}
      NODE_EXPORTER_PORT: ${NODE_EXPORTER_PORT:-9100}
      ONLY_DESC_REGEX:    ${RUNNER_SD_DESC_REGEX:-}
    networks:
      - monitoring-net

networks:
  # Internal-only: the signer. No external connectivity in or out; only the
  # bits-console backend is also attached here (Phase 3).
  signer-net:
    driver: bridge
    internal: true
  # Backend <-> public front (web.cern.ch reverse-proxy).
  services-net:
    driver: bridge
  # The monitoring stack (Phase 4). Publishes only VM :8428 and its CORS proxy
  # :8430; the signer is never reachable from here.
  monitoring-net:
    driver: bridge
  # The backend and the worker <-> the credentials proxy, which reaches GitLab
  # and the store from here (not internal: it needs the way out).
  cred-net:
    driver: bridge
  # The worker <-> the store writer, which reaches the store from here (not
  # internal). Nothing else is on it: the backend cannot reach the writer.
  store-net:
    driver: bridge
  # The worker <-> the sbom-scanner, which downloads its database from here
  # (not internal). Nothing else is on it.
  scan-net:
    driver: bridge
  # The worker (and vmagent) <-> audit-log. Internal: no way in or out.
  audit-net:
    driver: bridge
    internal: true

secrets:
  # The audit-log write token, shared by audit-log and the worker (make audit-token).
  audit_token:
    file: ./secrets/audit_token

volumes:
  # The signer's agent UNIX socket; shared read-only with the backend (until M8b).
  signer-sockets:
  # Empty: what the backend mounts in the signer's place after the switch.
  retired-signer-sockets:
  # The credentials proxy's agent socket; read-only for the backend and the worker.
  credential-sockets:
  # The store writer's agent socket; read-only for the worker alone.
  store-writer-sockets:
  # Persistent WebAuthn passkey store for the backend (survives restarts).
  webauthn-creds:
  # The orchestrator's SQLite database, shared by the backend and the worker.
  orch-data:
  # grype's vulnerability database (sbom-scanner).
  scanner-db:
