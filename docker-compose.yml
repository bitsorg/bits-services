# SPDX-License-Identifier: Apache-2.0
# bits-services — persistent supporting services.
#
# Services are added per implementation-plan phase:
#   Phase 1: security-proxy        (the signer; internal network only)
#   Phase 3: bits-console backend  (relying party; only client of the proxy)
#   Phase 4: monitoring            (extracted from cvmfs-testbed)
#
# Networks are declared now so each service attaches to the right isolated
# segment when it lands. The signer sits on an internal-only network reachable
# solely by the backend; nothing else may talk to it.

services:
  # ─── Phase 1: the manifest signer ──────────────────────────────────────────
  # Reachable ONLY on signer-net, by the bits-console backend (Phase 3). No
  # published ports. No key baked or mounted — the Ed25519 seed is pushed over
  # the ingest socket at runtime and held only in memory.
  security-proxy:
    build:
      # Context is the submodule itself, not the repo root: BuildKit omits a git
      # submodule's files when the context root is the parent repo (the gitlink
      # reads as empty). The Dockerfile lives outside that context, which compose
      # + BuildKit allow.
      context: ali-bot/security-proxy
      dockerfile: ../../security-proxy/Dockerfile
    image: bits-services/security-proxy:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Keep the in-memory key off disk: no core dump can write it out, and don't
    # swap the proxy's anon pages (belt-and-suspenders with swapoff -a on the VM).
    ulimits:
      core: 0
    mem_swappiness: 0
    volumes:
      # Root-owned config (from security-proxy/config.sample.json), read-only.
      - ${SECURITY_PROXY_CONFIG_DIR:?set SECURITY_PROXY_CONFIG_DIR in .env}:/etc/security-proxy:ro
      # Agent + ingest sockets on a named volume (inherits the image's
      # securityproxy ownership); the backend shares this volume in Phase 3.
      - signer-sockets:/run/security-proxy
    networks:
      - signer-net
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/security-proxy/agent.sock"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ─── Phase 3 (Stage B): the relying-party backend ──────────────────────────
  # Its OWN origin (e.g. https://bits.cern.ch): the browser on the GitLab Pages
  # frontend (bits-console.web.cern.ch) calls it cross-origin. It is the ONLY
  # client of the security-proxy (signer-net) and holds no key. Built from the
  # local `bits` checkout (console-backend/ + bits_helpers/).
  bits-console-backend:
    build:
      # Built from your LOCAL bits checkout (BITS_SRC, default ../bits) — a
      # submodule can't be used here (the console-backend code is local/unpushed).
      context: ${BITS_SRC:-../bits}
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY . /src
        ENV PYTHONPATH=/src:/src/console-backend PYTHONDONTWRITEBYTECODE=1
        RUN pip install --no-cache-dir /src/console-backend cryptography pyyaml requests
        # /data (persistent passkey store) must be writable by the runtime user; a
        # fresh named volume mounted here inherits this ownership.
        RUN install -d -o nobody -g nogroup /data
        USER nobody
        EXPOSE 8443
        CMD ["uvicorn","console_backend.main:app","--host","0.0.0.0","--port","8443","--ssl-keyfile","/certs/key.pem","--ssl-certfile","/certs/cert.pem"]
    image: bits-services/bits-console-backend:local
    restart: unless-stopped
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Signing proxy — wired by `make unlock` once the proxy is up (URL + gate
      # token only exist then, and change on a proxy restart).
      BITS_SIGN_PROXY_URL: "${BITS_SIGN_PROXY_URL:-}"
      BITS_SIGN_PROXY_TOKEN: "${BITS_SIGN_PROXY_TOKEN:-}"
      # Identity (verifies the browser's GitLab token via GET /user) + CORS.
      GITLAB_API_URL: "${GITLAB_API_URL:-}"
      BITS_FRONTEND_ORIGIN: "${BITS_FRONTEND_ORIGIN:-}"
      BITS_ADMINS_POLICY: "${BITS_ADMINS_POLICY:-}"
      BITS_ADMIN_RESOLVE_TOKEN: "${BITS_ADMIN_RESOLVE_TOKEN:-}"
      # WebAuthn. rp_id is a shared parent (e.g. cern.ch) so one passkey works for
      # enrolment on the Pages frontend AND approval on this backend's own page;
      # both origins are accepted at verification (BITS_WEBAUTHN_ORIGINS must list
      # the backend origin, since the approve page runs there).
      BITS_WEBAUTHN_RP_ID: "${BITS_WEBAUTHN_RP_ID:-}"
      BITS_WEBAUTHN_ORIGIN: "${BITS_WEBAUTHN_ORIGIN:-}"
      BITS_WEBAUTHN_ORIGINS: "${BITS_WEBAUTHN_ORIGINS:-}"
      BITS_WEBAUTHN_CREDENTIALS: "${BITS_WEBAUTHN_CREDENTIALS:-/data/creds.json}"
      BITS_WEBAUTHN_REQUIRE_UV: "${BITS_WEBAUTHN_REQUIRE_UV:-1}"
      BITS_ENROLLMENT_AUTHORITY: "${BITS_ENROLLMENT_AUTHORITY:-1}"
      BITS_WEBAUTHN_REQUIRED: "${BITS_WEBAUTHN_REQUIRED:-0}"
      # CI identity (optional; for automated signing later).
      BITS_OIDC_ISSUER: "${BITS_OIDC_ISSUER:-}"
      BITS_OIDC_CI_AUDIENCE: "${BITS_OIDC_CI_AUDIENCE:-}"
      BITS_OIDC_JWKS_URL: "${BITS_OIDC_JWKS_URL:-}"
      BITS_CI_SIGNERS: "${BITS_CI_SIGNERS:-}"
    ports:
      - "443:8443"          # https on the backend's own origin
    volumes:
      - webauthn-creds:/data                                   # persistent passkeys
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR in .env}:/certs:ro    # cert.pem + key.pem
    networks:
      - signer-net
      - services-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:8443/healthz', context=ssl._create_unverified_context())"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

networks:
  # Internal-only: the signer. No external connectivity in or out; only the
  # bits-console backend is also attached here (Phase 3).
  signer-net:
    driver: bridge
    internal: true
  # Backend <-> public front (web.cern.ch reverse-proxy) and monitoring scrape.
  services-net:
    driver: bridge

volumes:
  # Agent + ingest UNIX sockets for the signer; shared with the backend (Phase 3).
  signer-sockets:
  # Persistent WebAuthn passkey store for the backend (survives restarts).
  webauthn-creds:
