# bits-store behind TLS: the build hosts' way in (DEPLOYMENT.md, "The store service").
# By path, so that an upload's start and complete, and a name's first-writer lease,
# which an instance holds in memory, always reach the same instance.
upstream bits_store {
    hash $uri consistent;
    # never another instance for a path while its own is down: two would grant one
    # name's first-writer lease (max_fails=0); a failed instance's requests fail
    server bits-store:8098 max_fails=0;
    keepalive 16;
}

server {
    listen 8443 ssl;
    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens       off;

    # JSON only, as bits-store reads it (an upload in parts declares its parts' MD5s):
    # the bytes go to S3.
    client_max_body_size 1m;

    # For vmagent on the store's own network, not for the build hosts.
    location = /metrics {
        return 404;
    }

    location / {
        limit_except GET HEAD POST {
            deny all;
        }
        # No URI here: the path goes on exactly as sent, as bits-store checks it.
        proxy_pass http://bits_store;
        proxy_next_upstream off;       # nor after a failed connect: one path, one instance
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_redirect off;            # its redirects point at S3, as they are
        # A complete copies the build into place, in parts above 5 GiB: minutes, up
        # to bits-store's own limit for builds of about 150 GiB.
        proxy_read_timeout 3h;
    }
}
